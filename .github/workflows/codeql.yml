name: CodeQL

# Static analysis on every push to the default branch and every PR, so the
# SAST check (scorecard.dev) sees full coverage; weekly sweep as a backstop.

on:
  pull_request:
    paths:
      - "crates/**"
      - "**/*.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  push:
    branches: [master]
  schedule:
    - cron: "23 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.29.1
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.29.1
        with:
          category: "/language:rust"
