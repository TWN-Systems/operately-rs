# release-plz configuration — https://release-plz.dev
#
# This is the SINGLE version authority for this repo. `cargo-release` and
# `release-please` must never also touch Cargo.toml/CHANGELOG.md; two version
# writers racing one manifest is how a tag and a published version drift apart.
#
# Flow: conventional commits land on `master` -> release-plz opens a release PR
# bumping the workspace version + regenerating CHANGELOG.md -> a human merges
# it (agents have no merge authority) -> release-plz tags `vX.Y.Z` and pushes
# the tag -> `.github/workflows/release.yml` publishes, signs, and attests.

[workspace]
changelog_config = "cliff.toml"

# Never publish on an ordinary push; publishing follows the release PR.
release_always = false
# Keep the branch in sync so the tag and the release PR cannot disagree.
release_branch = "master"

git_release_name = "operately-sdk v{{ version }}"
git_release_body = """
{{ changelog | replace(from="<!-- generated by git-cliff -->", to="") | trim }}

Full changelog: https://github.com/TWN-Systems/operately-rs/blob/master/CHANGELOG.md

Artifacts on this release are signed with cosign (keyless, Sigstore) and carry
an SLSA build provenance attestation. See [SECURITY.md](https://github.com/TWN-Systems/operately-rs/blob/master/SECURITY.md).
"""
