# cliff.toml — git-cliff configuration for CHANGELOG.md
#
# Drives CHANGELOG.md from conventional commits. Invoked by release-plz
# (see release-plz.toml); not run by hand.

[changelog]
header = """
# Changelog

All notable changes to `operately-sdk` are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project adheres
to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

This file is generated by [git-cliff](https://git-cliff.org) via
[release-plz](https://release-plz.dev). Do not edit it by hand — put the
message in the conventional commit instead.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits | sort(attribute="message") %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% if commit.breaking %} \
  (**BREAKING**){% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id | trim_start_matches(pat="v") | upper }}/commit/{{ commit.id }}))
{%- endfor %}
{%- endfor %}

"""
footer = """
[Full changelog](https://github.com/TWN-Systems/operately-rs/commits/master)
"""
trim = true

[git]
commit_preprocessors = [
  # Strip the release-plz / dependabot noise that would otherwise fill the log.
  { pattern = '.*chore\(release\).*', replace = '' },
  { pattern = '.*\(deps\).*', replace = '' },
  { pattern = '.*\(ci\).*', replace = '' },
]

# The 0.1.0 history predates conventional commits ("Rust bindings for
# Operately's external API, generated from api-catalog.json" and friends), so
# unconventional commits are kept rather than silently dropped — dropping them
# would ship an initial release whose changelog does not match its git log.
filter_unconventional = false
split_commits = false
protect_breaking_commits = false

[conventional_commits]
filter = true
commit_parsers = [
  { pattern = '^build',  group = "Build" },
  { pattern = '^ci',    group = "CI" },
  { pattern = '^docs',  group = "Documentation" },
  { pattern = '^feat',  group = "Added" },
  { pattern = '^fix',   group = "Fixed" },
  { pattern = '^perf',  group = "Performance" },
  { pattern = '^refactor', group = "Changed" },
  { pattern = '^style', group = "Changed" },
  { pattern = '^test',  group = "Tests" },
]
# Everything before the first conventional commit, e.g. the initial import.
default_group = "Other"
