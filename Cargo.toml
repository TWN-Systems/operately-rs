[package]
name = "operately"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for the Operately external API (/api/external/v1), generated from operately/operately's own api-catalog.json"
license = "MIT"

[lib]
name = "operately"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
