[workspace]
resolver = "2"
members = ["crates/operately-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Not a preference: the transitive `icu_*` crates (pulled in by reqwest via
# idna) declare `rust-version = 1.88`. Lower this only with a measured
# resolution that actually builds on the lower toolchain.
rust-version = "1.88"
license = "MIT"
authors = ["TWN Systems"]
repository = "https://github.com/TWN-Systems/operately-rs"
homepage = "https://github.com/TWN-Systems/operately-rs"
documentation = "https://docs.rs/operately-sdk"
readme = "README.md"
keywords = ["operately", "sdk", "client", "api", "rest"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["/.github", "/fuzz", "/.harness"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The generated module already carries a blanket allow (see src/lib.rs); the
# workspace floor is what keeps hand-written code honest.
all = { level = "deny", priority = -1 }
